<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto zapisywanko</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
<div class="container">
    <h1>Auto zapisywanko</h1>
    <p class="subtitle">Zapisywanko dla płomyczków</p>

    <form id="signupForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Hasło</label>
            <input type="password" id="password" required>
        </div>

        <div class="form-group">
            <label>Nazwa zajęć</label>
            <input type="text" id="className" required>
        </div>

        <div class="form-group">
            <label>Data zajęć (DD.MM)</label>
            <input type="text" id="classDate" required>
        </div>

        <div class="form-group">
            <label>Godzina zajęć (HH:MM)</label>
            <input type="text" id="classTime" required>
        </div>

        <div class="form-group">
            <label>Kiedy zapisać</label>
            <input type="datetime-local" id="joinAt" required>
        </div>

        <button type="submit" id="submitBtn">Wyślij</button>
    </form>

    <div id="message" class="message"></div>
</div>

<script>
function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = `message ${type}`;
    el.style.display = 'block';
}

document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading"></span>Przetwarzanie...';

    try {
        const payload = {
            email: email.value.trim(),
            password: password.value,
            class_name: className.value.trim(),
            class_date: classDate.value.trim(),
            class_time: classTime.value.trim(),

            // ✅ FIX: send local datetime WITHOUT converting to UTC
            join_at: joinAt.value
        };

        const res = await fetch(
            "https://class-joiner-dispatcher.dosiu-dm.workers.dev",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }
        );

        if (!res.ok) throw new Error(await res.text());
        showMessage("Pomyślnie wysłano!", "success");
        signupForm.reset();

    } catch (err) {
        showMessage("Błąd: " + err.message, "error");
    } finally {
        btn.disabled = false;
        btn.textContent = "Wyślij";
    }
});

// default joinAt
window.addEventListener('DOMContentLoaded', () => {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(17, 55, 0, 0);

    joinAt.value =
        d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0') + 'T' +
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
});
</script>
</body>
</html>
