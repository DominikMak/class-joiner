<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto zapisywanko</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auto zapisywanko</h1>
        <p class="subtitle">Zapisywanko dla płomyczków</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="twoj.email@example.com">
            </div>

            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" id="password" required placeholder="Twoje hasło">
            </div>

            <div class="form-group">
                <label for="className">Nazwa zajęć (Dokładnie jak w kalendarzu)</label>
                <input type="text" id="className" required placeholder="np. SHAPE">
            </div>

            <div class="form-group">
                <label for="classDate">Data zajęć (DD.MM) <- koniecznie DD.MM ale 1.01 NIE 01.01 kumasz?</label>
                <input type="text" id="classDate" required placeholder="DD.MM (np. 19.01 lub 1.01)">
            </div>

            <div class="form-group">
                <label for="classTime">Godzina zajęć (GG:MM) <-- nawet jak jest 9:00 to pisz 09:00</label>
                <input type="text" id="classTime" required placeholder="GG:MM (np. 09:00)">
            </div>

            <div class="form-group">
                <label for="joinAt">Kiedy zapisać - o której i kiedy ma wejść i kliknąć, kumasz? Czyli np. wiesz że w piątek o 20:00 ruszają zapisy to tutaj podajesz ten piątek o 20:00 można podać minutkę pozniej np 20:01 zamiast 20:00 bo czasami jest hop do przodu o minutke i moze za szybko probowac klikac.</label>
                <input type="datetime-local" id="joinAt" required>
            </div>

            <button type="submit" id="submitBtn">
                Wyślij rejestrację
            </button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        // Hide message
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // Format date to DD.MM format
        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}.${month}`;
        }

        // Format time to HH:MM format
        function formatTime(dateString) {
            const date = new Date(dateString);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessage();

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Przetwarzanie...';

            try {
                // Get form values
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const className = document.getElementById('className').value.trim();
                const classDate = document.getElementById('classDate').value.trim();
                const classTime = document.getElementById('classTime').value.trim();
                const joinAt = document.getElementById('joinAt').value;
    
                // Validate inputs
                if (!email || !password || !className || !classDate || !classTime || !joinAt) {
                    throw new Error('Proszę wypełnić wszystkie pola');
                }
    
                // Convert joinAt to ISO format if needed
                let joinAtRaw = joinAt;
                const date = new Date(joinAtRaw);
                
                // korekta o strefę czasową
                date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
                
                const joinAtISO = date.toISOString();
                // Make API request
                const response = await fetch("https://class-joiner-dispatcher.dosiu-dm.workers.dev", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        class_name: className,
                        class_date: classDate,
                        class_time: classTime,
                        join_at: joinAtISO
                    })
                });
    
                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMessage = `Żądanie API nie powiodło się ze statusem ${response.status}`;
                    try {
                        const errorJson = JSON.parse(errorText);
                        if (errorJson.message) {
                            errorMessage = errorJson.message;
                        }
                    } catch (e) {
                        if (errorText) {
                            errorMessage += ': ' + errorText;
                        }
                    }
                    throw new Error(errorMessage);
                }
    
                showMessage('Pomyślnie wysłano żądanie rejestracji!', 'success');
                    
                // Reset form
                document.getElementById('signupForm').reset();
                
            } catch (error) {
                showMessage('Błąd: ' + error.message, 'error');
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Auto-fill joinAt with current date/time + 1 day as default
        window.addEventListener('DOMContentLoaded', function() {
            const joinAtInput = document.getElementById('joinAt');
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(17, 55, 0, 0); // Default to 17:55 as in example
            
            // Format for datetime-local input (YYYY-MM-DDTHH:mm)
            const year = tomorrow.getFullYear();
            const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const day = String(tomorrow.getDate()).padStart(2, '0');
            const hours = String(tomorrow.getHours()).padStart(2, '0');
            const minutes = String(tomorrow.getMinutes()).padStart(2, '0');
            
            joinAtInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        });
    </script>
</body>
</html>
