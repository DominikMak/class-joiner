name: Auto Signer – Join Class

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
      email:
        required: true
      password:
        required: true
      class_name:
        required: true
      class_date:
        required: true
      class_time:
        required: true
        
permissions:
  issues: write

run-name: >
  Join ${{ inputs.class_name }}
  | ${{ inputs.class_date }} ${{ inputs.class_time }}

jobs:
  join-class:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Auto-Signer
        env:
          EMAIL: ${{ inputs.email }}
          PASSWORD: ${{ inputs.password }}
          CLASS_TO_JOIN_NAME: ${{ inputs.class_name }}
          CLASS_TO_JOIN_DATE: ${{ inputs.class_date }}
          CLASS_TO_JOIN_TIME: ${{ inputs.class_time }}
        run: npx playwright test

      - name: Mark issue as DONE
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "auto-sign:processing" \
            --add-label "auto-sign:done"
