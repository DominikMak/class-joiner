name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Environment Variables into HTML
        run: |
          if [ -f docs/index.html ]; then
            # Use Python to inject environment variables before the first <script> tag
            python3 << 'PYTHON'
          import re
          import os
          
          with open('docs/index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Get environment variables (set from GitHub Secrets)
          encryption_key = os.environ.get('ENCRYPTION_KEY', '')
          repo_pat = os.environ.get('REPO_PAT', '')
          
          # Create the environment variables script
          env_script = f'''    <script>
            // Injected from GitHub Secrets
            const ENCRYPTION_KEY = '{encryption_key}';
            const REPO_PAT = '{repo_pat}';
          </script>
          '''
          
          # Find the first <script> tag and insert before it
          pattern = r'(<script>)'
          replacement = env_script + r'\1'
          content = re.sub(pattern, replacement, content, count=1)
          
          with open('docs/index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          PYTHON
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
