name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      ENCRYPTION_KEY: ${{ secrets.PASSWORD_ENCRYPTION_KEY }}
      REPO_PAT: ${{ secrets.REPO_PAT }}steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Inject Environment Variables into HTML
        env:
          ENCRYPTION_KEY: ${{ secrets.PASSWORD_ENCRYPTION_KEY }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          python3 << 'PYTHON'
          import os
          import json
    
          path = 'docs/index.html'
    
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
    
          inject = f"""
          <script>
            window.ENCRYPTION_KEY = {json.dumps(os.environ['ENCRYPTION_KEY'])};
            window.REPO_PAT = {json.dumps(os.environ['REPO_PAT'])};
          </script>
          """
    
          if '</head>' not in content:
              raise Exception('Missing </head> tag')
    
          content = content.replace('</head>', inject + '\n</head>')
    
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYTHON
    
      - name: Setup Pages
        uses: actions/configure-pages@v4
    
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
    
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
