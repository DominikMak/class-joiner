name: Create Auto-Sign Issue

on:
  workflow_dispatch:
    inputs:
      email:
        description: "User email"
        required: true
      password:
        description: "Plain password"
        required: true
      class_name:
        description: "Class name"
        required: true
      class_date:
        description: "Class date"
        required: true
      class_time:
        description: "Class time"
        required: true
      join_at:
        description: "When to trigger auto-sign (Europe/Warsaw time)"
        required: true

permissions:
  issues: write
  actions: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create GitHub issue with pending label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.PASSWORD_ENCRYPTION_KEY }}

        run: |
          password_enc=$(echo "${{ inputs.password }}" | openssl enc -aes-256-cbc -a -salt -pass pass:$ENCRYPTION_KEY)
          body="email=${{ inputs.email }}\npassword=$password_enc\nclass_name=${{ inputs.class_name }}\nclass_date=${{ inputs.class_date }}\nclass_time=${{ inputs.class_time }}\njoin_at=${{ inputs.join_at }}"
          gh issue create \
            --title "Auto-sign request | ${{inputs.email}} | ${{inputs.class_name}}" \
            --body "$body" \
            --label "auto-sign:pending"
