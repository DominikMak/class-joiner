name: Create Auto-Sign Issue

on:
  repository_dispatch:
    types: [auto-sign-request]

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub issue with pending label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.PASSWORD_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          payload='${{ toJson(github.event.client_payload) }}'

          email=$(echo "$payload" | jq -r '.email')
          password=$(echo "$payload" | jq -r '.password')
          class_name=$(echo "$payload" | jq -r '.class_name')
          class_date=$(echo "$payload" | jq -r '.class_date')
          class_time=$(echo "$payload" | jq -r '.class_time')
          join_at=$(echo "$payload" | jq -r '.join_at')

          if [ -z "$email" ] || [ -z "$password" ] || [ -z "$join_at" ]; then
            echo "Missing required fields"
            exit 1
          fi

          password_enc=$(echo "$password" | \
            openssl enc -aes-256-cbc -a -A -salt -pass pass:"$ENCRYPTION_KEY")

          body="email=$email\npassword=$password_enc\nclass_name=$class_name\nclass_date=$class_date\nclass_time=$class_time\njoin_at=$join_at"

          gh issue create \
            --title "Auto-sign request | $email | $class_name" \
            --body "$body" \
            --label "auto-sign:pending"
